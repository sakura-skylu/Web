spring.application.name=doda
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/doda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 数据库初始化配置
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.platform=mysql
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml

# ------------------------------
# Expression analysis (R doda)
# ------------------------------
# engineBaseDir: cloned doda repo root (contains Rscripts/, results/, etc.)
doda.engine.baseDir=${DODA_ENGINE_BASE_DIR:engine/doda}
doda.work.rootDir=${DODA_WORK_ROOT_DIR:uploads}

# How to execute Rscript
doda.exec.mode=${DODA_EXEC_MODE:auto}
doda.exec.condaPath=${DODA_CONDA_PATH:conda}
doda.exec.condaEnv=${DODA_CONDA_ENV:r_doda}
doda.exec.rscriptCmd=${DODA_RSCRIPT_CMD:Rscript}
doda.exec.wslDistro=${DODA_WSL_DISTRO:}
doda.exec.wslUseCondaRun=${DODA_WSL_USE_CONDA_RUN:true}

# Task execution
doda.task.pool-size=${DODA_TASK_POOL_SIZE:2}
doda.task.queue-capacity=${DODA_TASK_QUEUE_CAPACITY:20}
doda.task.script-timeout-ms=${DODA_TASK_SCRIPT_TIMEOUT_MS:1800000}

# Large CSV uploads
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
